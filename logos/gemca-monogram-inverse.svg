<?xml version="1.0" encoding="UTF-8"?>
<!--
  GEMCA Monogram Inverse — white G mark on deep navy
  For dark backgrounds, app icons, favicon, and brand stamps
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="GEMCA Monogram">
  <!-- Navy background with subtle corner radius for icon use -->
  <rect width="200" height="200" fill="#0B1E3E" rx="32"/>

  <!-- G Mark — white on navy -->
  <g fill="#FFFFFF">
    <!-- Left vertical bar -->
    <rect x="20"  y="20"  width="24" height="160" rx="3"/>
    <!-- Top horizontal bar -->
    <rect x="20"  y="20"  width="160" height="24" rx="3"/>
    <!-- Bottom horizontal bar -->
    <rect x="20"  y="156" width="160" height="24" rx="3"/>
    <!-- Upper-right vertical bar (top half only) -->
    <rect x="156" y="20"  width="24" height="80"  rx="3"/>
    <!-- Inner horizontal shelf — accent (lighter blue works on navy) -->
    <rect x="96"  y="76"  width="84" height="24"  rx="3" fill="#5B9EF0"/>
  </g>
</svg>
